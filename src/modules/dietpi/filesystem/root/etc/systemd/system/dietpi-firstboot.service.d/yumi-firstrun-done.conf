# YumiOS: dietpi-firstboot leaves /boot/dietpi/.install_stage at 0, which makes
# dietpi-login start the DietPi first-run setup (dietpi-update, dietpi-software,
# reboot — all needing network) on the next interactive login, root or not.
# YumiOS has its own firstboot wizard: mark the DietPi first run as completed as
# soon as dietpi-firstboot has applied the basic settings (hostname, passwords,
# locale, timezone, network interfaces). dietpi-postboot is ordered after this
# unit, so it already sees the completed state.
[Service]
ExecStartPost=/bin/sh -c 'echo 2 > /boot/dietpi/.install_stage'
