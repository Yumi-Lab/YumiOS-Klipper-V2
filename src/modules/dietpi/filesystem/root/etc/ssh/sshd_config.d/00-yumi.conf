# YumiOS: no root login over SSH (the pi account is the one to use, like on the
# Armbian base where the armbian module patches sshd_config the same way).
# dietpi-firstboot writes "PermitRootLogin yes" into dietpi.conf of this directory;
# sshd keeps the first value it reads and includes these files in lexical order,
# so this file has to sort before dietpi.conf.
PermitRootLogin no
