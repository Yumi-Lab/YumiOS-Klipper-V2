# YumiOS: the OTG port is a USB network gadget (g_ncm, usb0) configured by the
# base image's usb-gadget-net.service with the fixed address 172.22.1.1/24 —
# SSH over a single USB cable, no DHCP. Left to NetworkManager, usb0 would get a
# DHCP profile and lose that address. Keep it out of NM's hands.
[keyfile]
unmanaged-devices=interface-name:usb0
